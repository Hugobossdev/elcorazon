name: elcorazon_core
description: >
  Fondations partagées pour les 3 apps Flutter d'El Corazón (Phase 6) : client
  API, authentification et session, communes plutôt que triplées.
version: 0.1.0
publish_to: "none"

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.2
  jwt_decoder: ^2.0.1
  web_socket_channel: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
