name: elcora_fast
description: "El corazon - Application de livraison de repas avec amour comme ingrédient principal. Application Flutter complète avec gestion de commandes, paiements, suivi en temps réel, gamification et bien plus."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  
  # State management
  provider: ^6.1.2
  flutter_riverpod: ^3.0.3
  
  # Backend & Database
  
  # Local storage
  shared_preferences: ^2.3.2
  
  # Utilities
  uuid: ^4.5.1
  intl: ^0.20.2
  
  # UI components
  flutter_rating_bar: ^4.0.1
  intl_phone_field: ^3.2.0
  
  # Notifications
  flutter_local_notifications: ^19.5.0
  # Push FCM (Phase 6) — mêmes versions que `apps/dely`
  firebase_core: ^4.2.1
  firebase_messaging: ^16.0.4
  
  # Connectivity
  connectivity_plus: ^7.0.0
  
  # Real-time communication
  agora_rtc_engine: ^6.3.0
  url_launcher: ^6.3.0
  
  # Location & Maps
  geolocator: ^14.0.2
  google_maps_flutter: ^2.9.0
  
  # Database
  sqflite: ^2.3.3+1
  
  flutter_dotenv: ^6.0.0

  # Backend Django v2 (Phase 6) — fondations partagées avec dely/admin
  elcorazon_core:
    path: ../../packages/elcorazon_core
  
  # Fonts
  google_fonts: ^6.2.1
  

  http: any
  path: any
  timezone: any

  # Notifications de premier plan sur le Web : `flutter_local_notifications`
  # n'a pas d'implémentation Web (son `show()` sort sur `kIsWeb`), et le
  # service worker ne couvre que l'arrière-plan. L'affichage passe donc par
  # `ServiceWorkerRegistration.showNotification`, importé sous condition dans
  # `lib/services/push/`. Déjà tiré transitivement par `firebase_*_web` ;
  # déclaré ici parce qu'on l'importe directement.
  web: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  build_runner: ^2.4.8
  freezed: ^2.5.8
  json_serializable: ^6.9.5

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo/logo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/logo/logo.png
    - assets/icons/google.png
    - .env
