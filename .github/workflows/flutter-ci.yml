# Intégration continue des applications Flutter d'El Corazón.
#
# Complète `backend-ci.yml`, qui ne couvre que Django : depuis la Phase 6, le
# respect du contrat d'API vit pour une bonne part côté client (parsing des
# réponses, en-têtes d'idempotence, ce que le client s'interdit d'envoyer), et
# rien ne le vérifiait automatiquement.
#
# Deux filets, et ils ne couvrent pas la même chose.
#
# Le paquet partagé `packages/elcorazon_core` teste le **contrat** : ce que le
# client envoie, ce qu'il sait lire, ce qu'il s'interdit. Il est testé une fois,
# là, pas trois fois dans les apps qui le consomment.
#
# Les trois applications testent ce que le paquet ne peut pas voir : la logique
# d'écran et les propriétés qu'on refuse de perdre. C'est là, par exemple, que
# vit la garde contre le retour d'une saisie de carte bancaire dans
# l'application du livreur (constat S-1 de l'audit du 2 août 2026).
#
# **`flutter test` est bloquant partout.** Un test rouge arrête la CI.

name: Flutter CI

on:
  push:
    paths:
      - "projet/el-corazon/packages/**"
      - "projet/el-corazon/El Corazon fastfood/**"
      - "projet/el-corazon/El corazon dely/**"
      - "projet/el-corazon/El Corazon admin/**"
      - "projet/el-corazon/tools/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    paths:
      - "projet/el-corazon/packages/**"
      - "projet/el-corazon/El Corazon fastfood/**"
      - "projet/el-corazon/El corazon dely/**"
      - "projet/el-corazon/El Corazon admin/**"
      - "projet/el-corazon/tools/**"
      - ".github/workflows/flutter-ci.yml"

env:
  # Épinglée sur la version avec laquelle la migration a été menée et vérifiée.
  # Suivre `stable` ferait apparaître, sans qu'on y touche, des lints d'une
  # version ultérieure du SDK — la CI deviendrait rouge sur un commit qui n'a
  # rien changé.
  FLUTTER_VERSION: "3.35.5"

jobs:
  code_mort:
    name: Code injoignable
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projet/el-corazon
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Aucun fichier Dart que rien n'exécute
        # Ce contrôle existe parce que `flutter analyze` ne le fait pas :
        # vérifié le 2026-08-06 sur `dely/lib/dialogs/menu_item_dialog.dart`,
        # dont trois imports désignaient des répertoires inexistants sans
        # qu'aucun diagnostic ne soit rendu — ni par `flutter analyze`, ni par
        # `dart analyze --format=machine` sur le fichier seul. Un quart du code
        # des applications s'était accumulé derrière cet angle mort.
        #
        # Ce job est donc le seul qui empêche la dette de se reconstituer : les
        # 34 500 lignes supprimées le resteront tant qu'il est là, et pas une
        # heure de plus s'il saute. Il ne demande ni Flutter ni dépendances —
        # il lit les directives `import`/`export`/`part` et suit le graphe.
        run: python tools/code_mort.py

  paquet:
    name: Paquet partagé (analyse + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projet/el-corazon/packages/elcorazon_core
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Analyse — aucun écart toléré
        # Sans `--no-fatal-infos`, contrairement aux applications : le paquet est
        # du code écrit pour cette architecture, il n'a aucune dette de style à
        # traîner et doit le rester.
        run: flutter analyze

      - name: Tests du contrat
        # Ce que ces tests protègent n'est pas le parsing pour lui-même, mais les
        # règles que le client ne doit pas rejouer : montants en objet et non en
        # flottant, dates non nulles quand le schéma les déclare ainsi, et les
        # champs décidés par le serveur qu'un client n'a pas à envoyer
        # (`is_public`, `is_verified_purchase`, compteurs, identifiants
        # d'utilisateur).
        run: flutter test

  applications:
    name: ${{ matrix.nom }}
    runs-on: ubuntu-latest
    strategy:
      # Une application en échec ne doit pas masquer l'état des deux autres.
      fail-fast: false
      matrix:
        include:
          - nom: Client (fastfood)
            chemin: "projet/el-corazon/El Corazon fastfood"
          - nom: Livreur (dely)
            chemin: "projet/el-corazon/El corazon dely"
          - nom: Back-office (admin)
            chemin: "projet/el-corazon/El Corazon admin"
    defaults:
      run:
        working-directory: ${{ matrix.chemin }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Fichier .env
        # Les trois `pubspec.yaml` déclarent `.env` comme asset, et le fichier
        # est — à raison — hors du dépôt. L'analyseur ne lit pas son contenu, il
        # vérifie seulement que l'asset existe : sans ce fichier, un
        # `asset_does_not_exist` ferait échouer le job pour une raison qui n'a
        # rien à voir avec le code. Le gabarit quand il existe, un fichier vide
        # sinon (`admin` n'a pas encore de `.env.example`).
        run: |
          if [ -f .env.example ]; then cp .env.example .env; else : > .env; fi

      - run: flutter pub get

      - name: Analyse — erreurs et avertissements bloquants
        # `--no-fatal-infos` est délibéré, et c'est le seul compromis de ce
        # workflow : les trois applications traînent des « info » de style
        # (`use_build_context_synchronously`, `deprecated_member_use`,
        # `curly_braces_in_flow_control_structures`) sur des écrans que la
        # migration n'a pas encore touchés. Les traiter comme bloquantes
        # rendrait la CI rouge dès sa création, donc inutile. Erreurs et
        # avertissements, eux, restent fatals — c'est ce qui compte : les trois
        # apps en sont à zéro et doivent y rester.
        run: flutter analyze --no-fatal-infos

      - name: Tests
        # Bloquant, sans exception. L'analyseur attrape ce qui ne compile pas ;
        # il ne dit rien d'un écran qui affiche le mauvais prix, ni d'une saisie
        # de carte bancaire qui reviendrait dans l'application du livreur.
        run: flutter test
