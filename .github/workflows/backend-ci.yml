# Intégration continue du backend El Corazón.
#
# La CI est l'environnement de référence pour la suite complète : elle dispose
# de PostGIS et de Redis, que le poste de développement du projet n'a pas.
# C'est donc ici que le géospatial et le temps réel sont réellement vérifiés
# (voir docs/architecture/02-architecture-generale.md §9).

name: Backend CI

on:
  push:
    paths: ["el-corazon-main/backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["el-corazon-main/backend/**", ".github/workflows/backend-ci.yml"]

defaults:
  run:
    working-directory: el-corazon-main/backend

env:
  PYTHON_VERSION: "3.13"

jobs:
  qualite:
    name: Qualité (ruff, mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff — style et bogues probables
        run: ruff check .
      - name: ruff — format
        run: ruff format --check .
      - name: mypy — typage strict
        run: mypy common config apps

  tests:
    name: Tests (PostGIS + Redis)
    runs-on: ubuntu-latest

    services:
      db:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_DB: elcorazon_test
          POSTGRES_USER: elcorazon
          POSTGRES_PASSWORD: elcorazon
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U elcorazon"
          --health-interval 5s --health-timeout 3s --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-only-not-a-secret
      GIS_ENABLED: "True"
      POSTGRES_DB: elcorazon_test
      POSTGRES_USER: elcorazon
      POSTGRES_PASSWORD: elcorazon
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Bibliothèques géospatiales
        # GDAL et GEOS sont des bibliothèques système, pas des paquets Python :
        # c'est le seul maillon que le poste de développement ne peut pas fournir.
        run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev

      - run: pip install -e ".[dev]"

      - name: Migrations — cohérence du schéma
        # Détecte une modification de modèle sans migration correspondante.
        # Sans ce garde-fou, la divergence n'apparaît qu'au déploiement.
        run: python manage.py makemigrations --check --dry-run

      - name: Suite complète
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: couverture
          path: el-corazon-main/backend/coverage.xml

  contrat:
    name: Contrat d'API
    runs-on: ubuntu-latest
    needs: qualite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y gdal-bin libgdal-dev libgeos-dev
      - run: pip install -e ".[dev]"
      - name: Génération du schéma OpenAPI
        # Le schéma est un artefact de revue (ADR-009) : toute rupture de
        # contrat devient visible dans la pull request, avant livraison.
        env:
          DJANGO_SETTINGS_MODULE: config.settings.test
          DJANGO_SECRET_KEY: ci-only-not-a-secret
          GIS_ENABLED: "False"
        run: python manage.py spectacular --file openapi.yaml --fail-on-warn
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: el-corazon-main/backend/openapi.yaml

  image:
    name: Construction de l'image
    runs-on: ubuntu-latest
    needs: [qualite, tests]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: el-corazon-main/backend
          target: runtime
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
