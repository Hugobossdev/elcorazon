# Environnement de développement de référence (ADR-001, Phase 8).
#
#   docker compose up
#
# Il porte PostGIS et Redis, que le poste Windows du projet n'a pas. C'est donc
# ici — et en CI — que la suite de tests complète s'exécute.

name: elcorazon

services:
  db:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-elcorazon}
      POSTGRES_USER: ${POSTGRES_USER:-elcorazon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-elcorazon}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"   # 5433 : le poste a déjà un PostgreSQL 17 sur 5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-elcorazon}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly no --save ""
    # Ni persistance ni sauvegarde : Redis ne porte que du cache, des files et
    # le channel layer. Rien dont la perte serait un incident métier.
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      target: dev
    command: >
      sh -c "python manage.py migrate --noinput &&
             uvicorn config.asgi:application --host 0.0.0.0 --port 8000 --reload"
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app          # rechargement à chaud
      - ./secrets:/run/secrets:ro
    ports:
      - "8000:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build:
      context: .
      target: dev
    command: celery -A config worker --loglevel=info --concurrency=2
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - ./secrets:/run/secrets:ro
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}

  beat:
    build:
      context: .
      target: dev
    command: celery -A config beat --loglevel=info
    env_file: .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      POSTGRES_HOST: db
      REDIS_URL: redis://redis:6379/0
    volumes:
      - .:/app
      - ./secrets:/run/secrets:ro
    depends_on:
      redis: {condition: service_healthy}

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    volumes:
      - miniodata:/data
    ports:
      - "9000:9000"
      - "9001:9001"   # console

  nginx:
    image: nginx:alpine
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - api

volumes:
  pgdata:
  miniodata:
